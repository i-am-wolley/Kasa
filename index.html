<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F0EA" />
  <title>Kasa</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./app.css" />
  <!--
    importmap is empty for now — no bare-specifier deps until Firebase
    lands in build-plan Phase 4 (e.g. "firebase/app": "https://www.gstatic.com/firebasejs/.../firebase-app.js").
    All current imports are relative ES module paths, resolved natively.
  -->
  <script type="importmap">
    { "imports": {} }
  </script>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <header class="app-mark" aria-hidden="true">
        <!-- Kasa's mark: a roofline reduced to a single stroke, with a small
             dot resting where the walls meet the roof — "a home, watched
             over," the same house-plus-attention idea as the consequence
             tiers, drawn abstractly rather than as a literal house glyph. -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16.5 12 6l8 10.5" />
          <circle cx="12" cy="6" r="1.3" fill="currentColor" stroke="none" />
        </svg>
      </header>
      <div class="app-body">
        <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
        <main id="screen-mount" class="screen" aria-live="polite"></main>
      </div>
    </div>
  </div>
  <script type="module" src="./js/boot.js"></script>
</body>
</html>
