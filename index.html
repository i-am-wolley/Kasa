<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B8935A" />
  <title>Kasa</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./app.css" />
  <!--
    Build-plan Phase 4 (2026-08-05) — Google Auth + Firestore only for now
    (Apple/email-link auth and Storage deliberately not wired, per direct
    instruction). Pinned CDN version, not "latest", so a Firebase release
    doesn't silently change behavior mid-session.
  -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <header class="app-mark">
        <!-- Kasa's mark, take two — a roofline read as "another house icon"
             (2026-08-03 feedback: "too cliched"). Redrawn as one rounded
             square — the app's own dominant shape, the same silhouette as
             every House/Stock tile — with a small solid dot resting inside
             near a corner, the same "consequence dot" language used
             throughout the app. Reads as "one tracked thing, watched," and
             ties the mark to Kasa's actual UI vocabulary instead of a
             generic home pictogram. -->
        <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="5.5" />
          <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor" stroke="none" />
        </svg>
        <span class="app-wordmark">kasa</span>
        <div class="app-mark-actions">
          <!-- House picker (2026-08-05, user request) — filled in by
               boot.js (icon + label) and shown only once a household has
               more than one house; empty/hidden shell here otherwise. -->
          <button class="app-house-btn" id="app-house-btn" aria-label="Houses" style="display:none;"></button>
          <!-- More moved here from the bottom tab bar (2026-08-03, user
               request) so Wishlist could take its slot as a primary tab.
               Wired up in boot.js. -->
          <button class="app-more-btn" id="app-more-btn" aria-label="More">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="19" cy="12" r="1.1" fill="currentColor" stroke="none"/>
            </svg>
            More
          </button>
        </div>
      </header>
      <div class="app-body">
        <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
        <main id="screen-mount" class="screen" aria-live="polite"></main>
      </div>
    </div>
  </div>
  <script type="module" src="./js/boot.js"></script>
  <script>
    // PWA offline shell (build-plan Phase 7). Registered after load, not
    // blocking boot — matches memo §8.5 ("app must be fully usable in
    // airplane mode after first load") for the parts already buildable
    // pre-Firebase: static shell + packs. Plain inline script (not an ES
    // module) since it has nothing to import and runs once.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("[kasa] service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
